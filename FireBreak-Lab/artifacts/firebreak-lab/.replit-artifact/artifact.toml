kind = "web"
previewPath = "/"
title = "FireBreak Lab"
description = "Türkçe orman yangını ve bölgesel su hattı araştırma laboratuvarı; gerçek arazi, tekrarlanabilir deneyler ve ölçülebilir sonuçlar."
version = "1.0.0"
id = "artifacts/firebreak-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25830

[services.development]
run = "pnpm --filter @workspace/firebreak-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firebreak-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/firebreak-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25830"
BASE_PATH = "/"
